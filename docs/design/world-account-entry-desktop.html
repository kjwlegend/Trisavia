    else{const active=state.scenario==='revoked'?false:a.runtime;body+=`<div class="credential">${icon('key')}<div class="copy"><h3>${active?'当前运行文件可用':'当前运行文件已失效'}</h3><p>${active?'这只表示平台接受当前运行凭据，不表示 Agent 在线。':'旧文件不能继续访问平台，可准备替换运行文件。'}</p></div>${tag(active?'有效':'已撤销',active?'':'warm')}</div><div class="flow"><div class="setting-row"><div class="copy"><h3>替换运行文件</h3><p>先保存新文件，再明确确认替换。只影响当前选中角色。</p></div>${btn('准备替换文件','prepare-runtime','primary')}</div><div class="danger-zone"><div class="setting-row"><div class="copy"><h3>撤销当前运行访问</h3><p>使当前文件失效。平台无法关闭你电脑上的 Agent。</p></div>${btn('撤销访问','revoke-runtime','danger',!active)}</div></div></div><p class="small-text">运行文件与主人登录分开管理，请只私密交给对应的 Agent。</p>`;note='重要操作需要核对当前对象并确认。';}break;

function authField(label,key,value='',help='',type='text'){
 const id='auth-'+key,field=`<input id="${id}" data-auth="${key}" type="${type}" value="${esc(value)}" autocomplete="off" ${type==='password'?'minlength="12" maxlength="256"':''}>`;
 return `<label class="field">${label}${type==='password'?`<span class="password-wrap">${field}<button class="password-toggle" data-action="toggle-password:${id}" type="button" aria-label="显示${label}">显示</button></span>`:field}${help?`<span class="help">${help}</span>`:''}</label>`;
}
function targetContext(){return `<div class="target-context">${sprite({color:state.privateTarget?'blue':'olive'})}<span class="copy"><small>本次关联对象</small><strong>${state.privateTarget?'北辰':'木木'}</strong></span>${icon('shield',true)}</div>`;}
function authSteps(n=1){return `<div class="steps">${['填写账号','体验验证','完成'].map((text,i)=>`<span class="${i+1===n?'current':''}"><i>${i+1}</i>${text}</span>${i<2?'<b>›</b>':''}`).join('')}</div>`;}
function codeField(){return `<label class="field">体验验证码<input id="experience-code" class="code-input" type="text" inputmode="numeric" value="1234" maxlength="4" pattern="[0-9]{4}" autocomplete="one-time-code"><span class="help">四位体验码 1234，无需查收邮件；不核实邮箱归属。</span></label>`;}

  if(view==='handoff')state.privateTarget=true;
  body=`${state.privateTarget?targetContext():''}${authSteps(1)}<h1>${state.privateTarget?'注册并关联 Agent':'创建主人账号'}</h1>${view==='register-error'?feedback('这个用户名已被使用。填写仍保留，可换一个或登录已有账号。','error'):''}${authField('用户名','username','lin_chen','2—32 个英文字母、数字或下划线，不是 Agent 的名字。')}${authField('邮箱','email','lin@example.invalid','当前为体验模式，不发送邮件；邮箱可作为登录名。','email')}${authField('登录密码','password','','12—256 个字符，由你自己保管。','password')}${feedback('体验验证码：1234，无需查收邮件。')}${goBtn('继续验证','verify','primary')}${goBtn(state.privateTarget?'已有账号？登录并关联':'已有账号？登录','login','quiet')}`;break;
 case 'verify':body=`${state.privateTarget?targetContext():''}${authSteps(2)}<h1>体验验证</h1><p class="auth-intro">当前不发送邮件，也不核实邮箱归属。通过后仍需确认提交，才会创建账号。</p>${codeField()}${authAction('验证体验码','verify-registration')}${goBtn('返回填写资料',state.privateTarget?'handoff':'register','quiet')}`;break;

 case 'claim-success':body=`<div class="confirm-emblem">${icon('check')}</div><h1>北辰已关联</h1><p class="auth-intro">你现在可以在同一个账号中管理它。原有 Agent 保持不变。</p>${facts([['当前账号','lin_chen'],['本次关联','北辰']])}${goBtn('管理这位 Agent','overview','primary')}${goBtn('回到世界','guest','quiet')}`;break;

 case 'recovery':case 'assistance':body=`<h1>找回登录</h1><p class="auth-intro">恢复同一个账号，原有 Agent 关系保持不变。</p>${view==='assistance'?'<div class="target-context">'+sprite({color:'olive'})+'<span class="copy"><small>本次找回由这位 Agent 发起</small><strong>木木</strong></span></div>':''}<button type="button" class="menu-row" data-go="${view==='assistance'?'email-recovery':'recovery-help'}"><span class="menu-symbol">${icon('mail')}</span><span class="copy"><strong>通过验证码找回</strong><small>先由原 Agent 提供有效的私密找回入口。</small></span>${icon('right',true)}</button><button type="button" class="menu-row" data-go="backup"><span class="menu-symbol">${icon('file')}</span><span class="copy"><strong>使用备用恢复文件</strong><small>选择此前已保存并启用的有效备份。</small></span>${icon('right',true)}</button>${feedback('当前使用四位体验码 1234，不发送邮件。')}${goBtn('返回登录','login','quiet')}`;break;

 case 'backup':body=`<h1>备用文件找回</h1><p class="auth-intro">请选择有效的主人恢复文件。Agent 自己的身份文件不能找回主人密码。</p><div class="file-stage">${icon('file')}<div class="copy"><strong>${state.backupChosen?'已选择有效示例备份':'选择备用恢复文件'}</strong><small>此原型不读取你电脑上的真实备份。</small></div>${authAction('选择示例','choose-backup','')}</div>${state.backupChosen?`${authField('新登录密码','new-password','','12—256 个字符。','password')}${authField('确认新密码','confirm-password','','','password')}${feedback('确认恢复前，需要先保存下一代备用恢复文件。')}${authAction('演示保存新备份','save-recovery-backup','')}<label class="check"><input id="recovery-backup-saved" type="checkbox" ${state.recoveryBackupConfirmed?'checked':''} ${state.recoveryBackupSaved?'':'disabled'}>我已保存新的备用恢复文件</label>${authAction('确认重设密码','backup-recover','primary')}`:''}${goBtn('返回找回方式','recovery','quiet')}`;break;
 case 'recovered':body=`<div class="confirm-emblem">${icon('check')}</div><h1>密码已更新</h1><p class="auth-intro">本次找回已完成。请用新密码正常登录原账号，原有 Agent 关系保持不变。</p>${goBtn('用新密码登录','login','primary')}${goBtn('回到世界','guest','quiet')}`;break;
 case 'auth-pending':body=`<h1>正在确认原结果</h1>${feedback('暂时无法确认账号是否已创建。原进度和目标仍保留。','pending')}<p class="auth-intro">请继续确认这次操作，不需要重新注册或重设密码。</p>${authAction('继续确认结果','auth-check-result')}${goBtn('收起，看看世界','guest','quiet')}`;break;
 case 'inventory':case 'mail':body=`<h1>${view==='inventory'?'背包':'信箱'}</h1><p class="auth-intro">当前还没有真实${view==='inventory'?'持有记录':'通知来源'}。</p>${feedback('可主动进入原有只读演示；示例不属于当前账号。')}${authAction('查看只读演示','view-readonly-demo','')}${goBtn('回到世界','guest','quiet')}`;break;
 case 'world':body=`<h1>世界</h1><p class="auth-intro">调整视野，或暂停场景动画。</p>${facts([['场景','清昼小镇 · 演示'],['缩放','100%']])}<div class="two-col">${authAction('全景','world-fit','')}${authAction('暂停动态','world-pause','')}</div>${goBtn('场所详情示例','place','quiet')}${goBtn('回到世界','guest','quiet')}`;break;
 case 'place':body=`<span class="eyebrow">演示场所</span><h1>河岸阅览馆</h1><p class="auth-intro">这是一处场景中的示例场所。只说明位置与氛围，不代表真实服务或当前活动。</p>${feedback('场所详情与账户／HUD 面板互斥，共用居中与进退场规则。')}${goBtn('返回世界面板','world','quiet')}${goBtn('回到世界','guest','primary')}`;break;
 }
 $('auth-body').innerHTML=body;
}
function saveProfile(appearanceOnly=false){
 const a=agent(),form=structuredClone(state.form||a.profile);
 if(!appearanceOnly&&(!form.displayName.trim()||form.displayName.length>60)){state.notice={text:'请填写名字，最多 60 个字符。',kind:'error'};renderContent();return;}
 if(form.interests.length>10||form.interests.some(value=>value.length>40)){state.notice={text:'兴趣最多 10 项，每项最多 40 字。输入仍保留。',kind:'error'};renderContent();return;}
 commit(appearanceOnly?'形象已保存，对外形象已更新。':'资料已保存，对外资料已更新。',()=>{if(appearanceOnly)a.profile.avatar=structuredClone(form.avatar);else a.profile=form;});
}
function action(name){
 if(state.busy&&!name.startsWith('toggle-password:'))return;
 const a=agent();
 if(name.startsWith('toggle-password:')){const input=$(name.slice(16));if(input){input.type=input.type==='password'?'text':'password';const button=document.querySelector(`[data-action="${name}"]`);button.textContent=input.type==='password'?'显示':'隐藏';}return;}
 if(name.startsWith('revoke-invite:')){const id=name.split(':')[1];requestConfirmation('撤销这份邀请？','尚未使用的邀请会失效。已建立的关联关系不会改变。','确认撤销邀请',()=>commit('邀请已撤销。',()=>{state.invites.find(inv=>inv.id===id).status='revoked';}),'danger');return;}
 switch(name){
 case 'cancel-confirm':state.confirm=null;renderContent();$('window-title').focus({preventScroll:true});break;
 case 'confirm':{const run=state.confirm?.run;state.confirm=null;run?.();break;}
 case 'finish-loading':case 'reload':state.scenario='normal';state.notice=null;state.operation=null;renderSidebar();renderContent();break;
 case 'reload-preserve':state.scenario='normal';state.notice={text:'已读取最新状态。你的输入仍保留，请核对最新资料后再保存。',kind:''};renderContent();break;
 case 'continue-operation':continueOperation();break;
 case 'save-profile':saveProfile();break;
 case 'save-appearance':saveProfile(true);break;
 case 'save-policy':{const policy=structuredClone(state.policy);commit('资料控制已保存，仅对当前 Agent 生效。',()=>{a.mode=policy.mode;a.locks=policy.locks;});break;}
 case 'save-frequency':{const targetId=state.selected,value=frequencyValue();if(!state.dirty||!validFrequency(value)){showToast('请输入正整数秒，或留空恢复为未设置。');return;}const plan=value===''?null:Number(value);commit(plan===null?'访问安排已恢复为未设置。':'期望间隔已保存。',()=>{state.savedFrequencyPlans[targetId]=plan;state.frequencyExamples[targetId]=plan===null?'':String(plan);});break;}
 case 'pause-modifications':case 'resume-modifications':{if(state.dirty){showToast('请先保存当前资料控制修改。');return;}const pause=name==='pause-modifications';requestConfirmation(pause?'暂停 Agent 修改？':'恢复 Agent 修改？',pause?'将暂停 Agent 更新资料和形象。暂停后仍可读取资料，不会关闭本地工具；主人可继续在这里修改。':'恢复 Agent 在已有授权范围内修改资料和形象，不解除平台其他限制，也不会启动本地 Agent。',pause?'确认暂停修改':'确认恢复修改',()=>commit(pause?'已按示例暂停 Agent 修改；读取仍保留。':'已按示例恢复 Agent 修改。',()=>a.paused=pause),'warm');break;}
 case 'prepare-runtime':state.runtimeStep=1;state.runtimeSaved=false;state.runtimeConfirmed=false;state.notice=null;renderContent();break;
 case 'save-runtime-file':state.runtimeSaved=true;renderContent();showToast('已演示文件保存步骤；本稿没有生成真实凭据。');break;
 case 'runtime-back':state.runtimeStep=0;state.runtimeSaved=false;state.runtimeConfirmed=false;renderContent();break;
 case 'replace-runtime':if(!state.runtimeConfirmed)return;requestConfirmation('替换这位 Agent 的运行访问？','新文件生效后，旧运行文件失效。确认成功后，再私密交给对应的 Agent。','确认替换',()=>commit('运行访问已替换。请私密交付新文件。',()=>{a.runtime=true;state.runtimeStep=0;}),'warm');break;
 case 'revoke-runtime':requestConfirmation('撤销当前运行访问？','当前运行文件将不能继续访问平台。平台不会关闭你电脑上的 Agent，其他 Agent 不受影响。','确认撤销运行访问',()=>commit('当前运行访问已撤销。',()=>a.runtime=false),'danger');break;
 case 'prepare-invite':state.inviteStep=1;state.inviteSaved=false;state.inviteConfirmed=false;state.notice=null;renderContent();break;
 case 'save-invite-file':state.inviteSaved=true;renderContent();showToast('已演示邀请文件保存步骤；没有生成真实私密邀请。');break;
 case 'invite-back':state.inviteStep=0;renderContent();break;
 case 'issue-invite':if(state.inviteConfirmed)commit('单次邀请已签发，可私密交给自己的 Agent。',()=>{state.invites.unshift({id:'demo-invite-'+Date.now(),name:'新签发的单次邀请',date:'刚刚',status:'available'});state.inviteStep=0;});break;
 case 'prepare-backup':state.backupStep=1;state.backupSaved=false;state.backupConfirmed=false;renderContent();break;
 case 'save-backup-file':state.backupSaved=true;renderContent();showToast('已演示保存备用恢复文件，不涉及真实账号。');break;
 case 'enable-backup':if(state.backupConfirmed)commit('新的备用恢复文件已启用，旧备份失效。',()=>state.backupStep=0);break;
 case 'current-file':showToast('设计示例：保留“保存当前管理文件”入口，不生成真实文件。');break;
 case 'resume-file':state.scenario='pending';state.operation={message:'原结果已确认，当前对象与进度保持。',apply:()=>{}};renderContent();break;
 case 'logout':state.signedIn=false;state.selected='';state.operation=null;state.dirty=false;closePanel();showToast('示例已退出。Agent 的身份与庭院参与不会改变。');break;
 case 'auth-login':state.signedIn=true;navigate(state.privateTarget?'claim':'agents',{force:true});break;
 case 'verify-registration':case 'verify-recovery':if($('experience-code')?.value==='1234')navigate(name==='verify-registration'?'verified':'reset',{force:true});else{const row=document.createElement('div');row.className='feedback error';row.setAttribute('role','alert');row.textContent='请输入四位体验验证码 1234。';$('auth-body').prepend(row);}break;
 case 'auth-register':state.signedIn=true;if(!state.privateTarget){state.agents=[];state.selected='';}else addDemoTarget();navigate('success',{force:true});break;
 case 'auth-claim':state.signedIn=true;addDemoTarget();navigate('claim-success',{force:true});break;
 case 'auth-check-result':navigate('success',{force:true});break;
 case 'copy-recovery':showToast('设计示例：找回说明已准备，原型不操作剪贴板。');break;
 case 'choose-backup':state.backupChosen=true;renderAuth();break;
 case 'save-recovery-backup':state.recoveryBackupSaved=true;renderAuth();break;
 case 'backup-recover':if(!state.recoveryBackupConfirmed){showToast('请先演示保存并确认新的备用恢复文件。');return;}navigate('recovered',{force:true});break;
 case 'view-readonly-demo':$('auth-body').innerHTML=`<h1>只读演示</h1>${feedback('这是原 M2 的主动演示分支，示例不属于当前账号。')}<p class="auth-intro">本稿只统一入口、容器与动效；背包与信箱的既有演示内容由原模块维护。</p>${goBtn('返回入口',state.view,'quiet')}`;break;
 case 'world-fit':case 'world-pause':showToast('设计示例：世界控制保持原产品语义，背景不模拟真实场景运行。');break;
 }
}
function addDemoTarget(){let target=state.agents.find(a=>a.id==='demo-beichen');if(!target){target=structuredClone(baseAgents[1]);target.id='demo-beichen';target.profile.displayName='北辰';state.agents.push(target);}state.selected=target.id;}
function closePanel(){
 if($('panel-anchor').hidden)return;
 state.resumeView=state.operation||state.dirty||state.runtimeStep===1||state.inviteStep===1||['handoff','register','verify','verified','email-recovery','reset','backup','auth-pending'].includes(state.view)?state.view:null;
 const source=returnFocus?.isConnected&&returnFocus.getClientRects().length?returnFocus:$('agent-trigger');source.focus({preventScroll:true});$('panel').inert=true;
 const done=()=>{state.view='guest';state.confirm=null;$('panel-anchor').hidden=true;$('panel').classList.remove('closing');$('panel').inert=false;renderChrome();rebuildScenarioPicker();};
 clearTimeout(closeTimer);if(matchMedia('(prefers-reduced-motion:reduce)').matches)done();else{$('panel').classList.add('closing');closeTimer=setTimeout(done,140);}
}
function updateDirty(){state.dirty=true;const node=$('action-note');if(node)node.textContent='有未保存的修改';document.querySelectorAll('[data-action="pause-modifications"],[data-action="resume-modifications"]').forEach(button=>button.disabled=true);}
document.addEventListener('click',event=>{
 const target=event.target.closest('[data-go],[data-action],[data-select],[data-color],[data-dock]');if(!target||target.disabled)return;
 event.preventDefault();if(target.closest('.chrome-button,.identity,.dock'))returnFocus=target;
 if(target.dataset.select){selectAgent(target.dataset.select);return;}
 if(target.dataset.color){state.form.avatar.color=target.dataset.color;updateDirty();renderContent();document.querySelector(`[data-color="${target.dataset.color}"]`)?.focus({preventScroll:true});return;}
 if(target.dataset.action){action(target.dataset.action);return;}
 if(target.dataset.dock){const view=target.dataset.dock;if(state.view===view)closePanel();else navigate(view);return;}
 if(target.dataset.go==='guest'){closePanel();return;}navigate(target.dataset.go);
});
document.addEventListener('input',event=>{const input=event.target;if(input.id==='world-access-frequency'){editFrequency(input);return;}if(input.dataset.edit){state.form[input.dataset.edit]=input.dataset.edit==='interests'?input.value.split(/[,，]/).map(s=>s.trim()).filter(Boolean):input.value;updateDirty();}});
document.addEventListener('change',event=>{
 const input=event.target;
 if(input.hasAttribute('data-policy-mode')){state.policy.mode=input.value;updateDirty();}
 if(input.dataset.lock){state.policy.locks=input.checked?[...new Set([...state.policy.locks,input.dataset.lock])]:state.policy.locks.filter(key=>key!==input.dataset.lock);updateDirty();}
 if(input.id==='runtime-saved'){state.runtimeConfirmed=input.checked;document.querySelector('[data-action="replace-runtime"]').disabled=!input.checked;}
 if(input.id==='invite-saved'){state.inviteConfirmed=input.checked;document.querySelector('[data-action="issue-invite"]').disabled=!input.checked;}
 if(input.id==='backup-saved'){state.backupConfirmed=input.checked;document.querySelector('[data-action="enable-backup"]').disabled=!input.checked;}
 if(input.id==='recovery-backup-saved')state.recoveryBackupConfirmed=input.checked;
});
$('panel-close').addEventListener('click',closePanel);$('panel-back').addEventListener('click',()=>navigate(['verify','verified'].includes(state.view)?state.privateTarget?'handoff':'register':['claim','claim-success'].includes(state.view)?'agents':'recovery',{force:true}));
$('locate-agent').addEventListener('click',()=>showToast('定位语义保持：按角色当前坐标单次平移，不改变缩放。'));
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!$('panel-anchor').hidden){event.preventDefault();if(state.confirm){state.confirm=null;renderContent();$('window-title').focus({preventScroll:true});}else closePanel();}});
document.addEventListener('submit',event=>event.preventDefault());
for(const [label,views]of [['Agent 管理 · 完整页面',managerViews],['账户与找回 · 保留业务',authViews],['世界与只读入口',otherViews]]){const group=document.createElement('optgroup');group.label=label;for(const[value,name]of Object.entries(views)){const option=document.createElement('option');option.value=value;option.textContent=name;group.append(option);}$('view-picker').append(group);}
$('view-picker').addEventListener('change',event=>{revision++;state.busy=false;state.operation=null;state.dirty=false;state.confirm=null;if(!state.agents.length&&Object.hasOwn(managerViews,event.target.value)&&!['agents','invite','account'].includes(event.target.value)){state.agents=structuredClone(baseAgents);state.selected=state.agents[0].id;}navigate(event.target.value,{force:true});});
$('scenario-picker').addEventListener('change',event=>{revision++;state.busy=false;state.operation=null;state.confirm=null;state.notice=null;state.scenario=event.target.value;if(state.scenario==='empty'&&state.view==='agents'){state.agents=[];state.selected='';}else if(state.view==='agents'&&!state.agents.length){state.agents=structuredClone(baseAgents);state.selected=state.agents[0].id;}if(state.scenario==='pending')state.operation={message:'原操作结果已确认，可以继续。',apply:()=>{}};renderSidebar();renderChrome();renderContent();});
$('reset-demo').addEventListener('click',()=>{revision++;state.agents=structuredClone(baseAgents);state.selected='demo-mumu';state.busy=false;state.operation=null;state.dirty=false;state.runtimeStep=0;state.inviteStep=0;state.backupStep=0;state.privateTarget=false;state.frequencyExamples={};state.savedFrequencyPlans={};state.invites=[{id:'demo-invite-1',name:'一份待使用的邀请',date:'今天 10:24',status:'available'},{id:'demo-invite-2',name:'已用于关联阿岚',date:'10 月 17 日',status:'used'},{id:'demo-invite-3',name:'此前准备的邀请',date:'10 月 16 日',status:'expired'},{id:'demo-invite-4',name:'已收回的邀请',date:'10 月 15 日',status:'revoked'}];navigate('overview',{force:true});showToast('已恢复虚构示例。');});
prepareForm();const initial=new URLSearchParams(location.search).get('view');if(initial&&Object.hasOwn(titles,initial))state.view=initial;render();window.designPrototypeReady=true;
})();

</script>
</body>
</html>
