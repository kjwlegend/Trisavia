<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trisavia · 地图精修</title><link rel="stylesheet" href="atlas.css"></head><body>
<div class="preview-context"><div class="brand">Trisavia <span>万物有邻</span></div><span>世界地图 · 精修设计预览</span><button id="open-map">打开地图</button></div>
<dialog id="atlas" aria-labelledby="atlas-title">
<header class="atlas-header"><div><span class="kicker">TRISAVIA WORLD ATLAS</span><h1 id="atlas-title">地图</h1></div><p>从清昼小镇出发，一起把想生活的世界建出来。</p><button id="close-map" class="icon-button" aria-label="关闭地图">×</button></header>
<div class="atlas-nav"><nav id="region-tabs" aria-label="选择地区"></nav><span>四片远方，一个世界</span></div>
<div class="atlas-body"><section class="map-column" aria-label="世界地图画面"><div id="map-viewport" class="map-viewport"><div id="map-stage" class="map-stage"><img id="terrain" src="assets/trisavia-atlas-base.jpg" width="1536" height="1024" alt="西侧岛屿与礁湾、中央原野、东方河岸小镇和北方层叠山地组成的精细插画世界地图" draggable="false"><svg id="boundaries" viewBox="0 0 1000 666.6667" preserveAspectRatio="none" aria-hidden="true"></svg><div id="region-labels"></div><div id="pins"></div></div><div class="compass" aria-hidden="true"><svg viewBox="0 0 44 52"><path d="M22 7v38M3 26h38M9 13l26 26M9 39l26-26"/><path class="needle" d="m22 8 5 18-5 17-5-17z"/><path class="north" d="m22 8 5 18h-10z"/></svg><span>N</span></div><div class="map-controls" aria-label="地图缩放"><button id="zoom-out" aria-label="缩小地图">−</button><button id="zoom-reset" aria-label="恢复世界全貌">100%</button><button id="zoom-in" aria-label="放大地图">＋</button></div><button id="art-only" aria-pressed="false">欣赏底图</button><div class="loading" id="loading">正在铺开地图…</div></div><div class="map-key"><span><i class="current"></i>当前镇 · 已开放</span><span><i></i>未来地点 · 未开放</span><span class="hint">放大后可拖动画面</span></div></section><aside id="details" aria-label="地区与地点详情"></aside></div>
<footer class="atlas-footer"><button id="locate" class="quiet"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/></svg>定位清昼小镇</button><span id="footnote">宏观世界地图 · 非行走地图</span><button id="enter" class="primary">回到清昼小镇 <span aria-hidden="true">↗</span></button></footer>
</dialog><div id="status" role="status"></div><script src="map-data.js"></script><script src="atlas-geometry.js"></script><script src="atlas.js"></script></body></html>
