# Initial ACME validation only; no application or authentication over HTTP.
server {
    listen 80;
    server_name 38.207.178.31;
    access_log off;
    error_log /var/log/nginx/agents-era-error.log warn;
    location ^~ /.well-known/acme-challenge/ {
        root /www/sites/agents-era/acme;
        try_files $uri =404;
    }
    location / { return 503; }
}
