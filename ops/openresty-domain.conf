server {
    listen 80;
    server_name world.kjwlabs.com;
    access_log off;
    error_log /var/log/nginx/agents-era-domain-error.log warn;
    location ^~ /.well-known/acme-challenge/ {
        root /www/sites/agents-era-domain/acme;
        try_files $uri =404;
    }
    location / {
        # Fail closed if an edge HTTPS request is sent to origin HTTP.
        # This avoids a Flexible-mode redirect loop and never serves auth here.
        if ($http_x_forwarded_proto = https) { return 503; }
        return 308 https://world.kjwlabs.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name world.kjwlabs.com;
    ssl_certificate /usr/local/openresty/nginx/conf/conf.d/agents-era-domain-tls/current/fullchain.pem;
    ssl_certificate_key /usr/local/openresty/nginx/conf/conf.d/agents-era-domain-tls/current/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:AgentsEraDomainTLS:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    include /usr/local/openresty/nginx/conf/conf.d/agents-era-domain/cloudflare-realip.conf;
    client_max_body_size 16k;
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;
    access_log off;
    error_log /var/log/nginx/agents-era-domain-error.log warn;
    if ($host != world.kjwlabs.com) { return 444; }

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host world.kjwlabs.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }
}
