server {
    listen 80;
    server_name 38.207.178.31;
    access_log off;
    error_log /var/log/nginx/agents-era-error.log warn;
    location ^~ /.well-known/acme-challenge/ {
        root /www/sites/agents-era/acme;
        try_files $uri =404;
    }
    location / { return 308 https://38.207.178.31$request_uri; }
}

server {
    # IP-literal clients commonly omit SNI. The previous implicit default had
    # an empty certificate and could not serve IP HTTPS; named hosts keep SNI.
    listen 443 ssl http2 default_server;
    server_name 38.207.178.31;
    ssl_certificate /usr/local/openresty/nginx/conf/conf.d/agents-era-tls/current/fullchain.pem;
    ssl_certificate_key /usr/local/openresty/nginx/conf/conf.d/agents-era-tls/current/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:AgentsEraTLS:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    client_max_body_size 16k;
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;
    access_log off;
    error_log /var/log/nginx/agents-era-error.log warn;
    if ($host != 38.207.178.31) { return 444; }

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host 38.207.178.31;
        proxy_set_header X-Real-IP $remote_addr;
        # Replace untrusted client forwarding headers, rather than append them.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }
}
