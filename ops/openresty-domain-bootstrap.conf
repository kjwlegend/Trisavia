# Certificate preparation only. Never proxy authentication over origin HTTP.
server {
    listen 80;
    server_name world.kjwlabs.com;
    access_log off;
    error_log /var/log/nginx/agents-era-domain-error.log warn;
    location ^~ /.well-known/acme-challenge/ {
        root /www/sites/agents-era-domain/acme;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control no-store always;
        add_header X-M1-Origin-Transport $scheme always;
        return 503;
    }
}
