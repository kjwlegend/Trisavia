# Local self-managed profile; production must set its own capacity/retention/TLS.
listen_addresses = '*'
port = 5432
max_connections = 40
shared_buffers = '256MB'
password_encryption = 'scram-sha-256'
timezone = 'UTC'
log_timezone = 'UTC'
logging_collector = off
log_statement = 'none'
log_min_error_statement = 'panic'
log_connections = off
log_disconnections = off
wal_level = replica
max_wal_senders = 4
# Lightweight local development: continuous archive copies are opt-in.
archive_mode = off
archive_command = 'sh /etc/postgresql/archive/command.sh "%p" "%f" /var/lib/postgresql/wal-archive'
archive_timeout = 0
wal_keep_size = '128MB'
